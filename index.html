<meta name="claude:viewport-fit-sides" content="cover">

<style>
/* Layout: one-screen app. Page tabs on top, drawing paper in the middle, crayon tray beside it (below it on phones). */
:root {
  --bg: #f1e9fb;        /* pale twilight lilac */
  --paper: #ffffff;
  --ink: #2b1d3d;       /* night plum for text */
  --tray: #fff6ea;      /* crayon box cardboard */
  --edge: #dccbef;
  --accent: #ff7a1a;    /* pumpkin orange for the active tool */
  --display: "Fredoka", "Baloo 2", "Comic Sans MS", system-ui, sans-serif;
  --body: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body);
  display: flex; flex-direction: column; overflow: hidden;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 10px;
  box-sizing: border-box; gap: 10px;
  -webkit-user-select: none; user-select: none;
}
header { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
h1 { font-family: var(--display); font-weight: 600; font-size: 1.35rem; margin: 0; letter-spacing: .01em; }
.pages { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; min-width: 0; flex: 1; }
.pages button {
  flex: 0 0 auto; width: 54px; height: 54px; border-radius: 14px; border: 3px solid var(--edge);
  background: var(--paper); padding: 4px; cursor: pointer;
}
.pages button img { width: 100%; height: 100%; display: block; }
.pages button[aria-pressed="true"] { border-color: var(--accent); }
main { flex: 1; min-height: 0; min-width: 0; display: flex; gap: 12px; }
.stage { flex: 1; min-width: 0; min-height: 0; display: grid; place-items: center; }
.paper { position: relative; aspect-ratio: 1; height: 100%; max-height: 100%; max-width: 100%;
  background: var(--paper); border-radius: 18px; box-shadow: 0 6px 0 var(--edge); overflow: hidden; touch-action: none; }
.paper canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
#lines { pointer-events: none; }
.tray { width: 200px; background: var(--tray); border: 3px solid var(--edge); border-radius: 18px; padding: 12px;
  display: flex; flex-direction: column; gap: 12px; overflow-y: auto; box-sizing: border-box; }
.label { font-family: var(--display); font-size: .8rem; letter-spacing: .06em; text-transform: uppercase; opacity: .7; }
.example img { display: block; width: 100%; aspect-ratio: 1; border-radius: 12px; border: 3px solid var(--edge); background: var(--paper); box-sizing: border-box; }
.colors { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.crayon { min-width: 0; aspect-ratio: 1; border-radius: 50%; border: 3px solid rgba(0,0,0,.12); cursor: pointer; padding: 0; }
.crayon[aria-pressed="true"] { outline: 4px solid var(--ink); outline-offset: 2px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
.tool, .act {
  font-family: var(--display); font-size: .95rem; border: 3px solid var(--edge); background: var(--paper);
  color: var(--ink); border-radius: 12px; padding: 8px 10px; cursor: pointer; flex: 1 1 auto; min-height: 44px;
}
.tool[aria-pressed="true"] { border-color: var(--accent); background: var(--accent); color: #fff; }
.size { width: 44px; height: 44px; flex: 0 0 auto; display: grid; place-items: center; padding: 0; }
.size span { display: block; border-radius: 50%; background: var(--ink); }
.size[aria-pressed="true"] { border-color: var(--accent); }
button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
@media (max-width: 700px) {
  main { flex-direction: column; }
  .tray { width: 100%; min-width: 0; flex-direction: row; flex-wrap: wrap; overflow: visible; padding: 10px; gap: 8px; }
  .tray .group { flex: 1 1 100%; }
  .tray .group.example { flex: 0 0 80px; }
  .tray .group.crayons { flex: 1 1 0; min-width: 0; }
  .colors { grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 6px; }
  .label { display: none; }
  .paper { height: auto; width: 100%; }
}
</style>

const COLORS = ["#ff7a1a","#ffb347","#ffd93d","#fff3c4","#7bc950","#2d6a4f","#9b5de5","#5a189a",

const EXAMPLES = {
  0: [[100, 100, DP], [250, 580, O], [385, 455, Y], [615, 455, Y], [500, 550, Y], [500, 670, Y], [500, 250, BR], [610, 235, G], [500, 950, DG]],

const paint = document.getElementById("paint"), lines = document.getElementById("lines");
const pc = paint.getContext("2d", { willReadFrequently: true }), lc = lines.getContext("2d", { willReadFrequently: true });
const W = paint.width, H = paint.height;
let color = COLORS[0], size = SIZES[1], tool = "fill", page = 0, undoStack = [], boundary = null;
const saved = {}; // paint layer per page, so switching pictures keeps the coloring

const svgURL = svg => "data:image/svg+xml;charset=utf-8," + encodeURIComponent(
  `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000">${svg}</svg>`);

function loadPage(i) {
  saved[page] = pc.getImageData(0, 0, W, H);
  page = i; undoStack = [];
  document.querySelectorAll("#pages button").forEach((b, k) => b.setAttribute("aria-pressed", k === i));
  pc.fillStyle = "#fff"; pc.fillRect(0, 0, W, H);
  if (saved[i]) pc.putImageData(saved[i], 0, 0);
  const img = new Image();
  img.onload = () => {
    lc.clearRect(0, 0, W, H); lc.drawImage(img, 0, 0, W, H);
    const a = lc.getImageData(0, 0, W, H).data;
    boundary = new Uint8Array(W * H);
    for (let p = 0; p < W * H; p++) boundary[p] = a[p * 4 + 3] > 90 ? 1 : 0;
  };
  img.src = svgURL(PAGES[i].svg);
  document.querySelector('.example').hidden = !!PAGES[i].blank;
  exampleFor(i, src => { if (page === i) document.getElementById("example").src = src; });

function pushUndo() { undoStack.push(pc.getImageData(0, 0, W, H)); if (undoStack.length > 25) undoStack.shift(); }

function hexRGB(h) { const n = parseInt(h.slice(1), 16); return [n >> 16, (n >> 8) & 255, n & 255]; }

function floodFill(x, y) { if (boundary) fillRegion(pc, boundary, W, H, x, y, color, 3, pushUndo); }

// Scanline flood fill on a paint layer, bounded by the line art; then grows a few px under the lines to hide seams.
function fillRegion(ctx, bnd, W, H, x, y, hex, passes, beforeWrite) {
  const boundary = bnd;
  x = Math.floor(x); y = Math.floor(y);
  if (x < 0 || y < 0 || x >= W || y >= H || boundary[y * W + x]) return;
  const img = ctx.getImageData(0, 0, W, H), d = img.data;
  const s = (y * W + x) * 4, sr = d[s], sg = d[s + 1], sb = d[s + 2];
  const [r, g, b] = hexRGB(hex);
  if (Math.abs(sr - r) + Math.abs(sg - g) + Math.abs(sb - b) < 6) return;
  const same = p => !boundary[p] && Math.abs(d[p*4]-sr) + Math.abs(d[p*4+1]-sg) + Math.abs(d[p*4+2]-sb) < 40;
  const mask = new Uint8Array(W * H), stack = [y * W + x];
  while (stack.length) {
    let p = stack.pop(), px = p % W, py = (p - px) / W;
    while (px > 0 && !mask[p - 1] && same(p - 1)) { p--; px--; }
    let up = false, down = false;
    for (; px < W && !mask[p] && same(p); p++, px++) {
      mask[p] = 1;
      if (py > 0) { const q = p - W; if (!mask[q] && same(q)) { if (!up) { stack.push(q); up = true; } } else up = false; }
      if (py < H - 1) { const q = p + W; if (!mask[q] && same(q)) { if (!down) { stack.push(q); down = true; } } else down = false; }
    }
  }
  for (let pass = 0; pass < passes; pass++) {
    const grow = [];
    for (let p = W; p < W * H - W; p++) if (!mask[p] && boundary[p] && (mask[p-1] || mask[p+1] || mask[p-W] || mask[p+W])) grow.push(p);
    grow.forEach(p => mask[p] = 1);
  }
  if (beforeWrite) beforeWrite();
  for (let p = 0; p < W * H; p++) if (mask[p]) { d[p*4] = r; d[p*4+1] = g; d[p*4+2] = b; d[p*4+3] = 255; }
  ctx.putImageData(img, 0, 0);
}

// Small finished example beside each picture, colored in the app itself from these tap points (1000x1000 page space).
const EX = 300, exCache = {};
function exampleFor(i, done) {
  if (exCache[i]) return done(exCache[i]);
  const img = new Image();
  img.onload = () => {
    const lcv = document.createElement("canvas"); lcv.width = lcv.height = EX;
    const lx = lcv.getContext("2d", { willReadFrequently: true }); lx.drawImage(img, 0, 0, EX, EX);
    const a = lx.getImageData(0, 0, EX, EX).data, bnd = new Uint8Array(EX * EX);
    for (let p = 0; p < EX * EX; p++) bnd[p] = a[p * 4 + 3] > 60 ? 1 : 0;
    const pcv = document.createElement("canvas"); pcv.width = pcv.height = EX;
    const px = pcv.getContext("2d", { willReadFrequently: true }); px.fillStyle = "#fff"; px.fillRect(0, 0, EX, EX);
    (EXAMPLES[i] || []).forEach(([x, y, c]) => fillRegion(px, bnd, EX, EX, x * EX / 1000, y * EX / 1000, c, 1));
    px.drawImage(lcv, 0, 0);
    done(exCache[i] = pcv.toDataURL("image/png"));
  };
  img.src = svgURL(PAGES[i].svg);
}

function toCanvas(e) {
  const r = paint.getBoundingClientRect();
  return [(e.clientX - r.left) * W / r.width, (e.clientY - r.top) * H / r.height];
}
let drawing = false, last = null;
paint.addEventListener("pointerdown", e => {
  e.preventDefault();
  const [x, y] = toCanvas(e);
  if (tool === "fill") return floodFill(x, y);
  paint.setPointerCapture(e.pointerId);
  pushUndo(); drawing = true; last = [x, y]; stroke(x, y);
});
paint.addEventListener("pointermove", e => { if (drawing) { const [x, y] = toCanvas(e); stroke(x, y); } });
["pointerup", "pointercancel", "pointerleave"].forEach(t => paint.addEventListener(t, () => drawing = false));
function stroke(x, y) {
  pc.strokeStyle = tool === "erase" ? "#fff" : color;
  pc.lineWidth = size; pc.lineCap = pc.lineJoin = "round";
  pc.beginPath(); pc.moveTo(last[0], last[1]); pc.lineTo(x + 0.01, y); pc.stroke();
  last = [x, y];
}

// UI
const pagesEl = document.getElementById("pages");
PAGES.forEach((p, i) => {
  const b = document.createElement("button");
  b.setAttribute("aria-label", p.name); b.innerHTML = `<img alt="" src="${svgURL(p.svg)}">`;
  b.onclick = () => loadPage(i); pagesEl.append(b);
});
const colorsEl = document.getElementById("colors");
COLORS.forEach(c => {
  const b = document.createElement("button");
  b.className = "crayon"; b.style.background = c; b.setAttribute("aria-label", "Color " + c);
  b.setAttribute("aria-pressed", c === color);
  b.onclick = () => { color = c; if (tool === "erase") setTool("fill");
    colorsEl.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b)); };
  colorsEl.append(b);
});
const sizesEl = document.getElementById("sizes");
SIZES.forEach(s => {
  const b = document.createElement("button");
  b.className = "tool size"; b.setAttribute("aria-label", "Brush size " + s);
  b.innerHTML = `<span style="width:${6 + s / 3}px;height:${6 + s / 3}px"></span>`;
  b.setAttribute("aria-pressed", s === size);
  b.onclick = () => { size = s; sizesEl.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b)); };
  sizesEl.append(b);
});
function setTool(t) {
  tool = t;
  ["fill", "brush", "erase"].forEach(k => document.getElementById("t-" + k).setAttribute("aria-pressed", k === t));
}
["fill", "brush", "erase"].forEach(k => document.getElementById("t-" + k).onclick = () => setTool(k));
document.getElementById("undo").onclick = () => { const s = undoStack.pop(); if (s) pc.putImageData(s, 0, 0); };
document.getElementById("clear").onclick = () => { pushUndo(); pc.fillStyle = "#fff"; pc.fillRect(0, 0, W, H); };

// Saving downloads a PNG when the file is opened on its own; inside an embedded preview downloads are blocked, so hide it there.
const saveBtn = document.getElementById("save");
if (window.self !== window.top) saveBtn.hidden = true;
saveBtn.onclick = () => {
  const out = document.createElement("canvas"); out.width = W; out.height = H;
  const oc = out.getContext("2d"); oc.drawImage(paint, 0, 0); oc.drawImage(lines, 0, 0);
  const a = document.createElement("a"); a.download = `my-${PAGES[page].name.toLowerCase()}.png`;
  a.href = out.toDataURL("image/png"); a.click();
};

pc.fillStyle = "#fff"; pc.fillRect(0, 0, W, H);
loadPage(0);
</script>
